<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Segundo CSS a modo de Prueba</title>
<style>
.h1_1 { /* Definiendo estilos para el título */
    color: red;
    font-size: 35px;
}   
.h1_2 { /* Definiendo estilos para el título */
    color: orange;
    font-size: 35px;
}
#h3_1 { /* Definiendo estilos para el título */
    color: blue;
    font-size: 35px;
}
/* Definiendo estilos para el párrafo con la clase "destacado" */
.parrafo_1 {
    color: purple;
    font-size: 30px;
    font-style: italic;
}
.parrafo_2 {
    color:green;
    font-size: 30px;
}
.logo {
    position: absolute;
    top: 10px;
    right: 10px;
}

</style>   
</head>
<body>
    <h1 class="h1_1">Hola, Mundo!</h1>
    <h1 class="h1_2">Hola, Mundo H1 siguiente!</h1>
    <h3 id="h3_1">Hola, Mundo H3 siguiente!</h3>
    <p class="parrafo_1">Este es un párrafo de ejemplo.</p>
    <p class="parrafo_2">Este es otro párrafo</p>
    <img class="logo" src="logo/cft.png" width="200" alt="cargando....">
    <button type="button" onclick="window.location.href='https://www.google.cl/'">Ir a Google</button> <br>

</body>
</html>
